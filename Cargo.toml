[workspace]
resolver = "2"
members = [
    "crates/buildlens-core",
    "crates/buildlens-parser",
    "crates/buildlens-plugins",
    "crates/buildlens-metrics",
    "crates/buildlens-diagnostics",
    "crates/buildlens-tests",
    "crates/buildlens-graph",
    "crates/buildlens-intel",
    "crates/buildlens-report",
    "crates/buildlens-dashboard",
    "crates/buildlens-server",
    "crates/buildlens-storage",
    "crates/buildlens-git",
    "crates/buildlens-cli",
]
default-members = ["crates/buildlens-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
criterion = "0.5"
flate2 = "1"
tiny_http = "0.12"
petgraph = "0.6"
regex = "1"
postgres = "0.19"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
