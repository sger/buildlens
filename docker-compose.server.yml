# The team server: Postgres plus the ingest endpoint CI pushes builds to.
#
#   printf 'BUILDLENS_TOKEN=%s\n' "$(openssl rand -hex 32)" > .env
#   podman compose -f docker-compose.server.yml up -d --build
#   podman compose -f docker-compose.server.yml logs -f server
#   podman compose -f docker-compose.server.yml down
#
# Separate from docker-compose.yml on purpose. That file starts Postgres alone,
# which is what `scripts/start.sh` and the single-machine local workflow expect;
# adding the server to it would make a local `compose up` demand a token for a
# service nobody running BuildLens on their own laptop needs.
#
# The volume is shared with docker-compose.yml, so a machine that has been
# collecting locally keeps its history when it starts serving a team.
services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    container_name: buildlens_db
    environment:
      POSTGRESQL_USER: buildlens
      POSTGRESQL_PASSWORD: buildlens
      POSTGRESQL_DATABASE: buildlens
    # Deliberately not published. The server reaches Postgres over the compose
    # network by service name, so publishing 5433 would only widen the surface
    # — and on a Synology it risks colliding with DSM's own PostgreSQL. Use
    # docker-compose.yml when you want it reachable from the host.
    expose:
      - "5432"
    volumes:
      - buildlens-pgdata:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildlens -d buildlens"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: buildlens:local
    container_name: buildlens_server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Service name, not localhost: inside the container that would be the
      # server itself. `sslmode=disable` because this never leaves the compose
      # network.
      DATABASE_URL: postgres://buildlens:buildlens@postgres:5432/buildlens?sslmode=disable
      # No default. The server refuses to start when this is unset, so a
      # forgotten variable is a failed deploy rather than an open endpoint.
      BUILDLENS_TOKEN: ${BUILDLENS_TOKEN:?set BUILDLENS_TOKEN, e.g. in a .env file beside this one}
      BUILDLENS_BIND: 0.0.0.0:8788
      BUILDLENS_POOL_SIZE: "8"
      BUILDLENS_THREADS: "8"
    ports:
      # Loopback for a local test. To let CI reach a NAS, change to
      # "8788:8788" — and note there is no TLS here, so the token crosses the
      # network in cleartext. Keep that on a trusted network or a VPN.
      - "127.0.0.1:8788:8788"
    healthcheck:
      # /health is the one unauthenticated route, and answers without touching
      # Postgres — so a brief database blip does not restart a server that is
      # otherwise fine.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8788/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  buildlens-pgdata:
